<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="t d">
  <!-- Generated by scripts/loop.mjs. Edit that file, not this one. Direction D2 dark. -->
  <title id="t">One iteration of 3PT: Plan, Build, Instrument under a frozen policy; the improver rewrites the policy and tags a checkpoint; everything in MongoDB Atlas; rollback restores a policy.</title>
  <desc id="d">Direction enters Plan. Plan, Build and Instrument run left to right under a frozen policy against a stage store that refuses policy and checkpoint writes. The improver reads findings, rewrites the policy as version n plus one, tags checkpoint cp slash n, and feeds Plan. Atlas holds policies, checkpoints, plans, findings, measurements, media index, transcripts and jobs. Rollback restores a prior policy from its checkpoint. Site photos enter through worker jobs.</desc>
  <defs>
    <style>
      .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em}
      .eyebrow{font-size:12px;font-weight:600}
      .h{fill:#E6E9EE;font-size:30px;font-weight:800;letter-spacing:-.01em}
      .h .a{fill:#FF6B4A}
      .title{font-size:17px;font-weight:700}
      .body{font-size:13px;font-weight:400}
      .chip{font-size:11px;font-weight:600}
      .tiny{font-size:10.5px;font-weight:500;letter-spacing:.08em}
      .foot{fill:#7B8694;font-size:12px;font-weight:500}
    </style>
    <marker id="m-8B7CF6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8B7CF6"/></marker><marker id="m-E0A33A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E0A33A"/></marker><marker id="m-3FB886" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3FB886"/></marker><marker id="m-FF6B4A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#FF6B4A"/></marker><marker id="m-3AA6D9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3AA6D9"/></marker><marker id="m-00ED64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#00ED64"/></marker><marker id="m-5E6C85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5E6C85"/></marker><marker id="m-A3ADBB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A3ADBB"/></marker>
    <clipPath id="frame"><rect width="1600" height="600" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="600" fill="#0F1216"/>
    <text class="mono eyebrow" x="64" y="44" fill="#7B8694">3PT · ONE ITERATION · THE LOOP AND THE RUN ARE SEPARATE</text>
    <text class="sans h" x="62" y="80">The run cannot change the rules. <tspan class="a">The improver can.</tspan></text>

    <!-- direction in -->
    <g>
      <rect x="64" y="150" width="180" height="90" rx="10" fill="#151A21" stroke="#5E6C85"/>
      <text class="mono eyebrow" x="80" y="176" fill="#A3ADBB">DIRECTION IN</text>
      <text class="sans body" x="80" y="198" fill="#E6E9EE">a superintendent, a PM,</text>
      <text class="sans body" x="80" y="216" fill="#E6E9EE">an owner, or an agent</text>
      <line x1="244" y1="195" x2="264" y2="195" stroke="#5E6C85" stroke-width="1.8"  marker-end="url(#m-5E6C85)"/>
    </g>

    
    <g>
      <rect x="270" y="120" width="300" height="150" rx="10" fill="#1A2029" stroke="#8B7CF6" stroke-opacity=".9" stroke-width="1.4"/>
      <rect x="270" y="120" width="300" height="4" rx="2" fill="#8B7CF6"/>
      <text class="mono eyebrow" x="286" y="148" fill="#8B7CF6">STAGE 1 · PLAN</text>
      <text class="sans title" x="286" y="172" fill="#E6E9EE">Reads, decides, specifies</text>
      <text class="sans body" x="286" y="196" fill="#A3ADBB">Reads the last checkpoint and M-* metrics.</text><text class="sans body" x="286" y="215" fill="#A3ADBB">Picks a sprint mode: feature, improve, fix.</text><text class="sans body" x="286" y="234" fill="#A3ADBB">Emits the spec and the evaluation plan.</text>
      
    </g>
    <g>
      <rect x="640" y="120" width="300" height="150" rx="10" fill="#1A2029" stroke="#E0A33A" stroke-opacity=".9" stroke-width="1.4"/>
      <rect x="640" y="120" width="300" height="4" rx="2" fill="#E0A33A"/>
      <text class="mono eyebrow" x="656" y="148" fill="#E0A33A">STAGE 2 · BUILD</text>
      <text class="sans title" x="656" y="172" fill="#E6E9EE">Wraps a coding agent</text>
      <text class="sans body" x="656" y="196" fill="#A3ADBB">claude-code, kiro or codex, frozen policy.</text><text class="sans body" x="656" y="215" fill="#A3ADBB">Builder and instrumenter take turns</text><text class="sans body" x="656" y="234" fill="#A3ADBB">until checks pass or the budget ends.</text>
      
    </g>
    <g>
      <rect x="1010" y="120" width="300" height="150" rx="10" fill="#1A2029" stroke="#3FB886" stroke-opacity=".9" stroke-width="1.4"/>
      <rect x="1010" y="120" width="300" height="4" rx="2" fill="#3FB886"/>
      <text class="mono eyebrow" x="1026" y="148" fill="#3FB886">STAGE 3 · INSTRUMENT</text>
      <text class="sans title" x="1026" y="172" fill="#E6E9EE">Checks, then writes findings</text>
      <text class="sans body" x="1026" y="196" fill="#A3ADBB">Runs the standards checks on the result.</text><text class="sans body" x="1026" y="215" fill="#A3ADBB">Writes this iteration's retrospective.</text><text class="sans body" x="1026" y="234" fill="#A3ADBB">Writes findings. Never touches the policy.</text>
      
    </g>
    <line x1="570" y1="195" x2="634" y2="195" stroke="#8B7CF6" stroke-width="1.8"  marker-end="url(#m-8B7CF6)"/><text class="mono tiny" x="605" y="184" text-anchor="middle" fill="#8B7CF6">spec</text>
    <line x1="940" y1="195" x2="1004" y2="195" stroke="#E0A33A" stroke-width="1.8"  marker-end="url(#m-E0A33A)"/><text class="mono tiny" x="975" y="184" text-anchor="middle" fill="#E0A33A">result</text>

    <!-- the frozen policy and the stage store, spanning the run -->
    <rect x="270" y="283" width="160" height="22" rx="11" fill="#151A21" stroke="#3AA6D9" stroke-width="1.2"/><text class="mono chip" x="350" y="298" text-anchor="middle" fill="#3AA6D9">FROZEN POLICY v n</text>
    <rect x="446" y="283" width="420" height="22" rx="11" fill="#151A21" stroke="#3AA6D9" stroke-width="1.2"/><text class="mono chip" x="656" y="298" text-anchor="middle" fill="#3AA6D9">STAGE STORE · REFUSES WRITES TO policies, checkpoints</text>
    <line x1="270" y1="316" x2="1310" y2="316" stroke="#3AA6D9" stroke-opacity=".35" stroke-dasharray="3 5"/>

    <!-- findings down to the improver, the backfeed to Plan, the checkpoint to Atlas -->
    <path d="M1280 270 V 394 H 986" fill="none" stroke="#3FB886" stroke-width="1.8" marker-end="url(#m-3FB886)"/><text class="mono tiny" x="1292" y="384" fill="#3FB886">findings</text>
    
    <g>
      <rect x="640" y="330" width="340" height="128" rx="10" fill="#1A2029" stroke="#FF6B4A" stroke-opacity=".9" stroke-width="1.4"/>
      <rect x="640" y="330" width="340" height="4" rx="2" fill="#FF6B4A"/>
      <text class="mono eyebrow" x="656" y="358" fill="#FF6B4A">AFTER THE RUN · IMPROVER</text>
      <text class="sans title" x="656" y="382" fill="#E6E9EE">Rewrites the harness itself</text>
      <text class="sans body" x="656" y="406" fill="#A3ADBB">Reads findings and checkpoints. Rewrites rules,</text><text class="sans body" x="656" y="425" fill="#A3ADBB">context policies, tool grants → policy v n+1.</text><text class="sans body" x="656" y="444" fill="#A3ADBB">Tags cp/n: git sha, policy, metrics, retro.</text>
      
    </g>
    <path d="M640 394 H 310 V 276" fill="none" stroke="#FF6B4A" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#m-FF6B4A)"/>
    <text class="mono tiny" x="330" y="386" fill="#FF6B4A">BACKFEED · v n+1 becomes Plan's context</text>
    <line x1="980" y1="354" x2="1346" y2="192" stroke="#FF6B4A" stroke-width="1.8"  marker-end="url(#m-FF6B4A)"/><text class="mono tiny" x="1206" y="332" text-anchor="middle" fill="#FF6B4A">policy v n+1 · cp/n</text>
    <line x1="1352" y1="416" x2="986" y2="438" stroke="#00ED64" stroke-width="1.8" stroke-dasharray="4 5" marker-end="url(#m-00ED64)"/><text class="mono tiny" x="810" y="480" text-anchor="middle" fill="#00ED64">3pt rollback cp/i · restores that policy as a new version</text>
    
    <g>
