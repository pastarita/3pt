      <rect x="1368" y="168" width="168" height="26" rx="5" fill="#151A21" stroke="#2A323D"/><text class="mono tiny" x="1378" y="185" fill="#3AA6D9">policies</text><text class="mono tiny" x="1526" y="185" text-anchor="end" fill="#7B8694">improver</text><rect x="1368" y="202" width="168" height="26" rx="5" fill="#151A21" stroke="#2A323D"/><text class="mono tiny" x="1378" y="219" fill="#3AA6D9">checkpoints</text><text class="mono tiny" x="1526" y="219" text-anchor="end" fill="#7B8694">improver</text><rect x="1368" y="236" width="168" height="26" rx="5" fill="#151A21" stroke="#2A323D"/><text class="mono tiny" x="1378" y="253" fill="#3AA6D9">plans</text><text class="mono tiny" x="1526" y="253" text-anchor="end" fill="#7B8694">plan</text><rect x="1368" y="270" width="168" height="26" rx="5" fill="#151A21" stroke="#2A323D"/><text class="mono tiny" x="1378" y="287" fill="#3AA6D9">findings</text><text class="mono tiny" x="1526" y="287" text-anchor="end" fill="#7B8694">instr.</text><rect x="1368" y="304" width="168" height="26" rx="5" fill="#151A21" stroke="#2A323D"/><text class="mono tiny" x="1378" y="321" fill="#3AA6D9">measurements</text><text class="mono tiny" x="1526" y="321" text-anchor="end" fill="#7B8694">instr.</text><rect x="1368" y="338" width="168" height="26" rx="5" fill="#151A21" stroke="#2A323D"/><text class="mono tiny" x="1378" y="355" fill="#3AA6D9">media_index</text><text class="mono tiny" x="1526" y="355" text-anchor="end" fill="#7B8694">worker</text><rect x="1368" y="372" width="168" height="26" rx="5" fill="#151A21" stroke="#2A323D"/><text class="mono tiny" x="1378" y="389" fill="#3AA6D9">transcripts</text><text class="mono tiny" x="1526" y="389" text-anchor="end" fill="#7B8694">worker</text><rect x="1368" y="406" width="168" height="26" rx="5" fill="#151A21" stroke="#2A323D"/><text class="mono tiny" x="1378" y="423" fill="#3AA6D9">jobs</text><text class="mono tiny" x="1526" y="423" text-anchor="end" fill="#7B8694">worker</text>
      <text class="mono tiny" x="1452" y="464" text-anchor="middle" fill="#7B8694">named in COLLECTIONS only</text>
    </g>
    <line x1="1310" y1="160" x2="1346" y2="156" stroke="#5E6C85" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#m-5E6C85)"/><text class="mono tiny" x="1331" y="150" text-anchor="middle" fill="#5E6C85">read</text>

    <!-- the workload from below -->
    <g>
