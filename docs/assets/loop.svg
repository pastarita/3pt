      <text class="mono eyebrow" x="80" y="526" fill="#E0A33A">THE WORKLOAD · SITE PHOTOS, PLANS, CAPTURES</text>
      <text class="sans body" x="80" y="548" fill="#A3ADBB">The worker consumes jobs: index → transcribe once → tier → migrate. Images are read once; transcripts are what the stages see.</text>
