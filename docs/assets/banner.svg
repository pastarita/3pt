<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="t d">
  <!-- 3PT README banner. Direction D2 "Instrument panel", dark set, depth variant: the same tokens with a field
       behind them. Text stays on the raised layer; the field never carries meaning. Tokens from
       hub/site/design-system.html COLOR.D2.dark. No web fonts: D2 is system type by design. Self-contained. -->
  <title id="t">3PT. The harness rewrote its rules. Approve or roll back.</title>
  <desc id="d">Three Point Harness: Plan, Build, Instrument. A self-improving meta-harness for coding agents; every checkpoint in MongoDB Atlas.</desc>
  <defs>
    <style>
      .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em}
      .eyebrow{fill:#7B8694;font-size:15px;font-weight:500}
      .eyebrow2{fill:#A3ADBB;font-size:16px;font-weight:500}
      .h{fill:#E6E9EE;font-size:60px;font-weight:800;letter-spacing:-.015em}
      .h .a{fill:#FF6B4A}
      .sub{fill:#A3ADBB;font-size:21px;font-weight:400}
      .btn{font-size:19px;font-weight:600}
      .chip{font-size:14px;font-weight:600;letter-spacing:.12em}
      .foot{fill:#7B8694;font-size:13px;font-weight:500}
      .vtx{font-size:13px;font-weight:600;letter-spacing:.12em}
    </style>
    <radialGradient id="gPlan" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8B7CF6" stop-opacity=".38"/><stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gBuild" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E0A33A" stop-opacity=".45"/><stop offset="1" stop-color="#E0A33A" stop-opacity="0"/></radialGradient>
    <radialGradient id="gInst" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3FB886" stop-opacity=".45"/><stop offset="1" stop-color="#3FB886" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F1216" stop-opacity="1"/><stop offset=".55" stop-color="#0F1216" stop-opacity=".6"/><stop offset="1" stop-color="#0F1216" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1600" height="520" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- canvas -->
    <rect width="1600" height="520" fill="#0F1216"/>

    <!-- the field: three glows at the vertices of the triangle, contour rings, all low opacity -->
    <g opacity=".9">
      <ellipse cx="1290" cy="40"  rx="360" ry="260" fill="url(#gPlan)"/>
      <ellipse cx="1000" cy="520" rx="380" ry="240" fill="url(#gBuild)"/>
      <ellipse cx="1580" cy="520" rx="380" ry="240" fill="url(#gInst)"/>
    </g>
    <g fill="none" stroke="#E6E9EE" stroke-opacity=".05" stroke-width="1">
      <path d="M1290 -60 L1000 560 L1580 560 Z"/>
      <path d="M1290 30 L1070 500 L1510 500 Z"/>
      <path d="M1290 120 L1140 440 L1440 440 Z"/>
      <path d="M1290 210 L1210 380 L1370 380 Z"/>
      <ellipse cx="1290" cy="330" rx="520" ry="330"/>
      <ellipse cx="1290" cy="330" rx="640" ry="410"/>
      <ellipse cx="1290" cy="330" rx="760" ry="490"/>
    </g>
    <!-- the field fades under the text column so the raised layer stays legible -->
    <rect width="1100" height="520" fill="url(#fade)"/>

    <!-- eyebrows -->
    <text class="mono eyebrow"  x="64" y="72">3PT · THREE POINT HARNESS</text>
    <text class="mono eyebrow2" x="64" y="104">HARNESS · V2 → V3 · PROPOSAL</text>

    <!-- headline -->
    <text class="sans h" x="60" y="178">The harness rewrote its rules.</text>
    <text class="sans h" x="60" y="246"><tspan class="a">Approve or roll back.</tspan></text>

    <!-- subline -->
    <text class="sans sub" x="64" y="296">A self-improving meta-harness for coding agents. Plan, Build, Instrument:</text>
    <text class="sans sub" x="64" y="326">the Instrument stage rewrites its own rules, context policies and tool grants,</text>
    <text class="sans sub" x="64" y="356">and persists every checkpoint to MongoDB Atlas.</text>

    <!-- controls and stage chips -->
    <g transform="translate(64,392)">
      <rect x="0" y="0" width="172" height="52" rx="10" fill="#FF6B4A"/>
      <text class="sans btn" x="86" y="33" text-anchor="middle" fill="#14100E">Approve v3</text>

      <rect x="188" y="0" width="150" height="52" rx="10" fill="#151A21" stroke="#5E6C85" stroke-width="1.5"/>
      <text class="sans btn" x="263" y="33" text-anchor="middle" fill="#E6E9EE">Roll back</text>

      <rect x="364" y="10" width="86" height="32" rx="99" fill="#151A21" stroke="#8B7CF6" stroke-width="1.5"/>
      <text class="mono chip" x="407" y="31" text-anchor="middle" fill="#8B7CF6">PLAN</text>

      <rect x="462" y="10" width="96" height="32" rx="99" fill="#151A21" stroke="#E0A33A" stroke-width="1.5"/>
      <text class="mono chip" x="510" y="31" text-anchor="middle" fill="#E0A33A">BUILD</text>

      <rect x="570" y="10" width="160" height="32" rx="99" fill="#151A21" stroke="#3FB886" stroke-width="1.5"/>
      <text class="mono chip" x="650" y="31" text-anchor="middle" fill="#3FB886">INSTRUMENT</text>
    </g>

    <!-- the mark: three points on a triangle, one hue per stage -->
    <g transform="translate(1290,270)">
      <path d="M0 -150 L-130 75 L130 75 Z" fill="none" stroke="#E6E9EE" stroke-opacity=".22" stroke-width="1.5"/>
      <path d="M0 -150 L0 0 M-130 75 L0 0 M130 75 L0 0" fill="none" stroke="#E6E9EE" stroke-opacity=".10" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#E6E9EE" fill-opacity=".35"/>
      <!-- Plan, apex -->
      <circle cx="0" cy="-150" r="22" fill="#8B7CF6" fill-opacity=".18"/>
      <circle cx="0" cy="-150" r="9"  fill="#8B7CF6"/>
      <text class="mono vtx" x="0" y="-186" text-anchor="middle" fill="#8B7CF6">PLAN</text>
      <!-- Build, lower left -->
      <circle cx="-130" cy="75" r="22" fill="#E0A33A" fill-opacity=".18"/>
      <circle cx="-130" cy="75" r="9"  fill="#E0A33A"/>
      <text class="mono vtx" x="-130" y="118" text-anchor="middle" fill="#E0A33A">BUILD</text>
      <!-- Instrument, lower right -->
      <circle cx="130" cy="75" r="22" fill="#3FB886" fill-opacity=".18"/>
      <circle cx="130" cy="75" r="9"  fill="#3FB886"/>
      <text class="mono vtx" x="130" y="118" text-anchor="middle" fill="#3FB886">INSTRUMENT</text>
      <!-- backfeed: Instrument writes back to Plan -->
      <path d="M118 62 Q120 -60 14 -140" fill="none" stroke="#FF6B4A" stroke-width="1.5" stroke-dasharray="4 5" stroke-opacity=".8"/>
      <path d="M18 -146 L6 -134 L20 -132 Z" fill="#FF6B4A" fill-opacity=".8"/>
    </g>

    <!-- footer line -->
    <text class="mono foot" x="64" y="490">MONGODB × CEREBRAL VALLEY · HARNESS ENGINEERING &amp; MODEL WRANGLING HACKATHON · NYC · 2026-09-26</text>
    <text class="mono foot" x="1536" y="490" text-anchor="end">MIT</text>

    <!-- frame -->
    <rect x=".5" y=".5" width="1599" height="519" rx="12" fill="none" stroke="#2A323D"/>
  </g>
</svg>
