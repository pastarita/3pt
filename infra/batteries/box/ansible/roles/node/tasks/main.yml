# node: Node {{ node_major }} from NodeSource, pnpm via corepack (the version package.json pins).
- name: nodesource key
  become: true
  ansible.builtin.get_url: { url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key, dest: /etc/apt/keyrings/nodesource.asc, mode: "0644" }
- name: nodesource repo
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
    filename: nodesource
    state: present
- name: nodejs
  become: true
  ansible.builtin.apt: { name: nodejs, state: present, update_cache: true }
- name: pnpm via corepack
  become: true
  ansible.builtin.shell: corepack enable && corepack prepare pnpm@{{ pnpm_version }} --activate
  args: { creates: /usr/bin/pnpm }
- name: versions
  ansible.builtin.shell: echo "node $(node -v) pnpm $(pnpm -v)"
  register: node_v
  changed_when: false
- ansible.builtin.debug: { msg: "{{ node_v.stdout }}" }
