# 3PT · workspace globs. The three top-level lanes are ui/, harness/, infra/ (docs/10-architecture.md).
# Inside each lane the Turborepo convention applies: apps/ are deployable or installable,
# packages/ are libraries. infra/batteries/ are provisioners: each one is a package that can
# stand up the thing the harness runs on (Atlas, blob, artifacts, repo, tracing).
packages:
  - ui/apps/*
  - ui/packages/*
  - harness/apps/*
  - harness/packages/*
  - infra/batteries/*
# pnpm 12: build scripts must be allowed here (package.json `pnpm.onlyBuiltDependencies` is no longer read).
# Without it `pnpm install` exits 1 with ERR_PNPM_IGNORED_BUILDS on a fresh machine (the box, CI).
allowBuilds:
  esbuild: true
  mongodb-client-encryption: true   # native libmongocrypt binding (CSFLE key vault, infra/batteries/atlas/src/vault.ts)
